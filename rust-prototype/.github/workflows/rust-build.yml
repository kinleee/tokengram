name: Rust cross-platform build

on:
  push:
    branches: [main]
    paths:
      - 'rust-prototype/**'
      - '.github/workflows/rust-build.yml'
  pull_request:
    paths:
      - 'rust-prototype/**'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: mla-search-rs.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: mla-search-rs
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: mla-search-rs
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: mla-search-rs

    defaults:
      run:
        working-directory: rust-prototype/mla-search-rs

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        uses: arduino/setup-protoc@v3
        with:
          version: "27.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-prototype/mla-search-rs -> target

      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }}

      - name: Check binary
        if: matrix.os != 'windows-latest'
        run: file target/${{ matrix.target }}/release/${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mla-search-rs-${{ matrix.target }}
          path: rust-prototype/mla-search-rs/target/${{ matrix.target }}/release/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Bundle release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Repackage artifacts
        run: |
          cd dist
          for d in mla-search-rs-*; do
            (cd "$d" && tar czf "../${d}.tar.gz" *)
          done
          ls -la

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          draft: true
