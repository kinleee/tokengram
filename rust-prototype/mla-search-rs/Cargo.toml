[package]
name = "mla-search-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
fastembed = "4"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
lancedb = "0.21"
arrow-array = "55"
arrow-schema = "55"
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
ignore = "0.4"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = "9"
hostname = "0.4"
machine-uid = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
dirs = "6"

[profile.release]
lto = true
codegen-units = 1
strip = true
