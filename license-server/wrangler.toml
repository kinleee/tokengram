name = "mla-license-server"
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

# ---- D1 bağlantısı ----
# wrangler d1 create mla-licenses → database_id-ni bura yapışdır
[[d1_databases]]
binding = "DB"
database_name = "mla-licenses"
database_id = "a678bb46-1080-46f8-90f2-d8af986f53b7"

# ---- KV cache (subscription status) ----
# wrangler kv:namespace create CACHE → id-ni bura yapışdır
[[kv_namespaces]]
binding = "CACHE"
id = "2480a43e70324afea3f10d0cd8438d8f"

# ---- Secrets (wrangler secret put NAME) ----
# JWT_PRIVATE_KEY     — RSA 2048 private key (PEM)
# POLAR_WEBHOOK_SECRET — Polar.sh webhook HMAC secret
# POLAR_API_KEY        — server-side API key (refund-lar üçün)

[env.staging]
name = "mla-license-server-staging"
vars = { ENVIRONMENT = "staging" }

[[env.staging.d1_databases]]
binding = "DB"
database_name = "mla-licenses"
database_id = "a678bb46-1080-46f8-90f2-d8af986f53b7"

[[env.staging.kv_namespaces]]
binding = "CACHE"
id = "2480a43e70324afea3f10d0cd8438d8f"

[env.production]
name = "mla-license-server-production"
vars = { ENVIRONMENT = "production" }

[[env.production.d1_databases]]
binding = "DB"
database_name = "mla-licenses"
database_id = "a678bb46-1080-46f8-90f2-d8af986f53b7"

[[env.production.kv_namespaces]]
binding = "CACHE"
id = "2480a43e70324afea3f10d0cd8438d8f"
